<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Embedded Messaging – Forced Dark Mode</title>
</head>

<body>
<h3>Chat Support – Dark Mode Forced</h3>

<script>
/* ---------------------------------------
   INIT EMBEDDED MESSAGING
---------------------------------------- */
function initEmbeddedMessaging() {
  try {
    embeddedservice_bootstrap.settings.language = 'en_US';

    embeddedservice_bootstrap.init(
      '00DDh0000003ik2',
      'NA_Messaging_Chat',
      'https://enphase--uat.sandbox.my.site.com/ESWNAMessagingChat1755609473327',
      {
        scrt2URL: 'https://enphase--uat.sandbox.my.salesforce-scrt.com'
      }
    );
  } catch (err) {
    console.error('Init Error', err);
  }
}

/* ---------------------------------------
   SET PRECHAT FIELDS
---------------------------------------- */
function setHiddenPrechatFields() {
  embeddedservice_bootstrap.prechatAPI.setHiddenPrechatFields({
    Chat_Source: 'ENHO',
    Persona: 'Homeowner',
    Site_Type: 'Solar',
    Referring_Site: 'ENHO Web',
    Country: 'UK'
  });
}

/* ---------------------------------------
   🔥 FORCE DARK MODE (AFTER SF OVERRIDE)
---------------------------------------- */
function forceDarkTheme() {
  const em = document.querySelector('embedded-messaging');

  if (!em || !em.shadowRoot) {
    console.warn('embedded-messaging or shadowRoot not ready');
    return;
  }

  console.log('🌙 Applying forced dark theme');

  const style = document.createElement('style');
  style.innerHTML = `
    /* Main container */
    .embeddedMessagingConversation {
      background: #000 !important;
      color: #fff !important;
    }

    /* Header */
    .embeddedMessagingHeader,
    .embeddedMessagingHeader * {
      background: #000 !important;
      color: #fff !important;
      border-bottom: 1px solid #222 !important;
    }

    /* Agent message bubble */
    .embeddedMessagingAgentMessage {
      background: #111 !important;
      color: #fff !important;
    }

    /* User message bubble */
    .embeddedMessagingUserMessage {
      background: #222 !important;
      color: #fff !important;
    }

    /* Message text */
    .embeddedMessagingMessageText {
      color: #fff !important;
    }

    /* Input / composer */
    .embeddedMessagingComposer {
      background: #000 !important;
      border-top: 1px solid #222 !important;
    }

    input,
    textarea {
      background: #000 !important;
      color: #fff !important;
      border: 1px solid #444 !important;
    }

    /* Buttons / icons */
    button,
    svg {
      color: #fff !important;
      fill: #fff !important;
    }
  `;

  em.shadowRoot.appendChild(style);
}

/* ---------------------------------------
   WAIT & RETRY (SF overrides multiple times)
---------------------------------------- */
const darkModeInterval = setInterval(() => {
  const em = document.querySelector('embedded-messaging');
  if (em?.shadowRoot) {
    forceDarkTheme();
    clearInterval(darkModeInterval);
  }
}, 500);

/* ---------------------------------------
   READY EVENT
---------------------------------------- */
window.addEventListener('onEmbeddedMessagingReady', () => {
  console.log('✅ Embedded Messaging Ready');
  setHiddenPrechatFields();
});
</script>

<script
  src="https://enphase--uat.sandbox.my.site.com/ESWNAMessagingChat1755609473327/assets/js/bootstrap.min.js"
  onload="initEmbeddedMessaging()">
</script>

</body>
</html>
