<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NA Messaging Chat - UAT</title>

    <style>
        /* Safety defaults (won’t win alone) */
        embedded-messaging {
            --branding-primary: #005290 !important;
            --branding-primary-dark: #003a6f !important;
        }

        /* Message bubbles */
        .embeddedMessagingMessage--user {
            background-color: #005290 !important;
            color: #ffffff !important;
        }

        .embeddedMessagingMessage--agent {
            background-color: #e3f2fd !important;
            color: #000000 !important;
        }
    </style>
</head>

<body>

<h3>Chat Support NA - UAT</h3>

<script>
    function initEmbeddedMessaging() {
        try {
            embeddedservice_bootstrap.settings.language = 'en_US';

            embeddedservice_bootstrap.init(
                '00DDh0000003ik2',
                'NA_Messaging_Chat',
                'https://enphase--uat.sandbox.my.site.com/ESWNAMessagingChat1755609473327',
                {
                    scrt2URL: 'https://enphase--uat.sandbox.my.salesforce-scrt.com'
                }
            );

            console.log( embeddedservice_bootstrap.brandingData);
        } catch (err) {
            console.error(err);
        }
    }

    function setHiddenPrechatFields() {
        embeddedservice_bootstrap.prechatAPI.setHiddenPrechatFields({
            Chat_Source: 'ENHO',
            Persona: 'Homeowner',
            Site_Type: 'Solar',
            Referring_Site: 'ENHO Mobile',
            Country: 'UK'
        });
    }

    /* 🔥 THE KEY PART 🔥 */
    window.addEventListener('onEmbeddedMessagingReady', function () {
        setHiddenPrechatFields();

        const em = document.querySelector('embedded-messaging');
        if (em) {
            em.style.setProperty('--branding-primary', '#005290');
            em.style.setProperty('--branding-primary-dark', '#003a6f');
        }
    });
</script>

<script
    src="https://enphase--uat.sandbox.my.site.com/ESWNAMessagingChat1755609473327/assets/js/bootstrap.min.js"
    onload="initEmbeddedMessaging()">
</script>

</body>
</html>
