<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Embedded Messaging – Dark Mode V2</title>

    <!-- Global dark variables -->
    <style>
        embedded-messaging {
            --branding-primary: #000000;
            --branding-primary-dark: #000000;
            --branding-accent: #ffffff;

            /* Text tokens */
            --slds-g-color-neutral-base-100: #ffffff;
            --slds-g-color-neutral-base-90: #ffffff;
            --slds-g-color-neutral-base-10: #000000;
        }
    </style>
</head>

<body>

<h3>Embedded Messaging – Dark Mode V2</h3>

<script>
function initEmbeddedMessaging() {
    try {
        embeddedservice_bootstrap.settings.language = 'en_US';

        /* 🔥 Dark branding (SUPPORTED) */
        embeddedservice_bootstrap.settings.branding = {
            primaryColor: '#000000',
            primaryColorDark: '#000000',

            headerBackgroundColor: '#000000',
            headerTextColor: '#ffffff',

            launcherBackgroundColor: '#000000',
            launcherTextColor: '#ffffff',

            accentColor: '#ffffff',

            agentBubbleBackgroundColor: '#000000',
            agentBubbleTextColor: '#ffffff',
            userBubbleBackgroundColor: '#000000',
            userBubbleTextColor: '#ffffff'
        };

        embeddedservice_bootstrap.init(
            '00DDh0000003ik2',
            'NA_Messaging_Chat',
            'https://enphase--uat.sandbox.my.site.com/ESWNAMessagingChat1755609473327',
            {
                scrt2URL: 'https://enphase--uat.sandbox.my.salesforce-scrt.com'
            }
        );
    } catch (e) {
        console.error(e);
    }
}

/* 🔒 Shadow DOM patch (BEST POSSIBLE) */
window.addEventListener('onEmbeddedMessagingReady', () => {
    const em = document.querySelector('embedded-messaging');
    if (!em || !em.shadowRoot) return;

    const style = document.createElement('style');
    style.textContent = `
        /* Chat body perception */
        .embeddedMessagingConversation {
            background: #111 !important;
        }

        /* Message bubbles */
        .embeddedMessagingMessage--agent,
        .embeddedMessagingMessage--user {
            background: #000 !important;
            color: #fff !important;
        }

        /* System messages */
        .embeddedMessagingSystemMessage {
            color: #fff !important;
        }

        /* Composer */
        textarea,
        input {
            color: #fff !important;
            background: #000 !important;
        }

        /* Icons */
        svg {
            fill: #fff !important;
        }
    `;
    em.shadowRoot.appendChild(style);
});
</script>

<script
    src="https://enphase--uat.sandbox.my.site.com/ESWNAMessagingChat1755609473327/assets/js/bootstrap.min.js"
    onload="initEmbeddedMessaging()">
</script>

</body>
</html>
