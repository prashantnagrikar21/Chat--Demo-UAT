<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Embedded Messaging – Dark Mode (SLDS Override)</title>
</head>

<body>
<h3>Chat Support – Forced Dark Mode</h3>

<script>
/* =====================================================
   INIT EMBEDDED MESSAGING
===================================================== */
function initEmbeddedMessaging() {
  try {
    embeddedservice_bootstrap.settings.language = 'en_US';

    embeddedservice_bootstrap.init(
      '00DDh0000003ik2',
      'NA_Messaging_Chat',
      'https://enphase--uat.sandbox.my.site.com/ESWNAMessagingChat1755609473327',
      {
        scrt2URL: 'https://enphase--uat.sandbox.my.salesforce-scrt.com'
      }
    );
  } catch (e) {
    console.error('Init error', e);
  }
}

/* =====================================================
   PRECHAT HIDDEN FIELDS
===================================================== */
function setHiddenPrechatFields() {
  embeddedservice_bootstrap.prechatAPI.setHiddenPrechatFields({
    Chat_Source: 'ENHO',
    Persona: 'Homeowner',
    Site_Type: 'Solar',
    Referring_Site: 'ENHO Web',
    Country: 'UK'
  });
}

/* =====================================================
   🔥 PRECHAT DARK MODE (SLDS TOKEN OVERRIDE)
===================================================== */
function injectPrechatDarkMode() {
  const em = document.querySelector('embedded-messaging');
  if (!em || !em.shadowRoot) return;

  const prechat = em.shadowRoot.querySelector('embeddedmessaging-prechat-state');
  if (!prechat || !prechat.shadowRoot) return;

  if (prechat.shadowRoot.querySelector('#dark-prechat-style')) return;

  console.log('🌙 Pre-chat SLDS dark mode applied');

  const style = document.createElement('style');
  style.id = 'dark-prechat-style';
  style.textContent = `
    /* 🔥 OVERRIDE SLDS BACKGROUND TOKENS (ROOT CAUSE FIX) */
    :host {
      --slds-g-color-neutral-base-100: #000000;
      --slds-g-color-neutral-base-95:  #000000;
      --slds-g-color-neutral-base-90:  #000000;
      --slds-g-color-neutral-base-80:  #000000;

      --slds-g-color-neutral-base-10:  #ffffff;
      --slds-g-color-neutral-base-20:  #ffffff;
      --slds-g-color-neutral-base-30:  #ffffff;
    }

    /* REMOVE WHITE PAINTED BACKGROUNDS */
    .containerArea,
    section,
    article,
    div,
    lightning-layout,
    lightning-layout-item,
    lightning-card,
    [class*="slds"] {
      background: transparent !important;
      color: #fff !important;
    }

    /* TEXT */
    label, span, p, h1, h2, h3 {
      color: #fff !important;
    }

    /* INPUTS */
    input,
    textarea,
    select {
      background: #000 !important;
      color: #fff !important;
      border: 1px solid #555 !important;
    }

    ::placeholder {
      color: #aaa !important;
    }

    /* BUTTON */
    button {
      background: #111 !important;
      color: #fff !important;
      border: 1px solid #555 !important;
    }
  `;

  prechat.shadowRoot.appendChild(style);
}

/* =====================================================
   🔥 CHAT CONVERSATION DARK MODE
===================================================== */
function injectChatDarkMode() {
  const em = document.querySelector('embedded-messaging');
  if (!em || !em.shadowRoot) return;

  if (em.shadowRoot.querySelector('#dark-chat-style')) return;

  console.log('🌙 Chat dark mode applied');

  const style = document.createElement('style');
  style.id = 'dark-chat-style';
  style.textContent = `
    .embeddedMessagingConversation {
      background: #000 !important;
      color: #fff !important;
    }

    .embeddedMessagingHeader,
    .embeddedMessagingHeader * {
      background: #000 !important;
      color: #fff !important;
      border-bottom: 1px solid #222 !important;
    }

    .embeddedMessagingAgentMessage {
      background: #111 !important;
      color: #fff !important;
    }

    .embeddedMessagingUserMessage {
      background: #222 !important;
      color: #fff !important;
    }

    .embeddedMessagingComposer {
      background: #000 !important;
      border-top: 1px solid #222 !important;
    }

    input, textarea {
      background: #000 !important;
      color: #fff !important;
      border: 1px solid #444 !important;
    }

    button, svg {
      color: #fff !important;
      fill: #fff !important;
    }
  `;

  em.shadowRoot.appendChild(style);
}

/* =====================================================
   RETRY UNTIL SALESFORCE FINISHES RENDERING
===================================================== */
const darkRetry = setInterval(() => {
  injectPrechatDarkMode();
  injectChatDarkMode();
}, 500);

setTimeout(() => clearInterval(darkRetry), 12000);

/* =====================================================
   READY EVENT
===================================================== */
window.addEventListener('onEmbeddedMessagingReady', () => {
  console.log('✅ Embedded Messaging Ready');
  setHiddenPrechatFields();
});
</script>

<script
  src="https://enphase--uat.sandbox.my.site.com/ESWNAMessagingChat1755609473327/assets/js/bootstrap.min.js"
  onload="initEmbeddedMessaging()">
</script>

</body>
</html>
