<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Embedded Messaging – Dark Theme</title>

    <!-- CSS variable safety layer -->
    <style>
        embedded-messaging {
            --branding-primary: #000000;
            --branding-primary-dark: #000000;
            --branding-accent: #ffffff;
            --branding-text-color: #ffffff;
            --branding-background: #000000;
        }
    </style>
</head>

<body>

<h3>Embedded Messaging – Dark Theme</h3>

<script>
/* -------------------------------------------
   UTILITY LOGGER
-------------------------------------------- */
function log(label, obj) {
    console.group(label);
    try {
        console.log(JSON.parse(JSON.stringify(obj)));
    } catch (e) {
        console.log(obj);
    }
    console.groupEnd();
}

/* -------------------------------------------
   INIT WITH DARK BRANDING
-------------------------------------------- */
function initEmbeddedMessaging() {
    try {
        embeddedservice_bootstrap.settings.language = 'en_US';

        /* ✅ DARK THEME BRANDING */
        embeddedservice_bootstrap.settings.branding = {
            /* Core */
            primaryColor: '#000000',
            primaryColorDark: '#000000',
            secondaryColor: '#000000',

            /* Header */
            headerBackgroundColor: '#000000',
            headerTextColor: '#ffffff',

            /* Launcher */
            launcherBackgroundColor: '#000000',
            launcherTextColor: '#ffffff',

            /* Chat bubbles */
            agentBubbleBackgroundColor: '#000000',
            agentBubbleTextColor: '#ffffff',
            userBubbleBackgroundColor: '#000000',
            userBubbleTextColor: '#ffffff',

            /* Accent / Icons */
            accentColor: '#ffffff',

            /* System / Labels */
            systemMessageTextColor: '#ffffff',
            systemMessageBackgroundColor: '#000000'
        };

        /* LOG BEFORE INIT */
        log('🔹 settings (before init)', embeddedservice_bootstrap.settings);

        embeddedservice_bootstrap.init(
            '00DDh0000003ik2',
            'NA_Messaging_Chat',
            'https://enphase--uat.sandbox.my.site.com/ESWNAMessagingChat1755609473327',
            {
                scrt2URL: 'https://enphase--uat.sandbox.my.salesforce-scrt.com'
            }
        );
    } catch (err) {
        console.error('Init error', err);
    }
}

/* -------------------------------------------
   READY EVENT – VERIFY APPLIED BRANDING
-------------------------------------------- */
window.addEventListener('onEmbeddedMessagingReady', () => {
    console.log('✅ Embedded Messaging Ready');

    /* FINAL BRANDING DATA */
    log('🎨 brandingData (final)', embeddedservice_bootstrap.brandingData);

    /* Shadow DOM variable enforcement (extra safety) */
    const em = document.querySelector('embedded-messaging');
    if (em) {
        em.style.setProperty('--branding-primary', '#000000');
        em.style.setProperty('--branding-primary-dark', '#000000');
        em.style.setProperty('--branding-accent', '#ffffff');
        em.style.setProperty('--branding-text-color', '#ffffff');
        em.style.setProperty('--branding-background', '#000000');
    }
});
</script>

<script
    src="https://enphase--uat.sandbox.my.site.com/ESWNAMessagingChat1755609473327/assets/js/bootstrap.min.js"
    onload="initEmbeddedMessaging()">
</script>

</body>
</html>
