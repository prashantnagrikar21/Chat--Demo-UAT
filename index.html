<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Embedded Messaging – Dark Mode Debug</title>

    <!-- CSS safety layer -->
    <style>
        embedded-messaging {
            --branding-primary: #000000;
            --branding-primary-dark: #000000;
            --branding-accent: #ffffff;

            --slds-g-color-neutral-base-100: #ffffff;
            --slds-g-color-neutral-base-90: #ffffff;
            --slds-g-color-neutral-base-10: #000000;
        }
    </style>
</head>

<body>

<h3>Embedded Messaging – Dark Mode Debug</h3>

<script>
/* -------------------------------
   LOGGER
-------------------------------- */
function log(title, data) {
    console.group(title);
    try {
        console.log(JSON.parse(JSON.stringify(data)));
    } catch (e) {
        console.log(data);
    }
    console.groupEnd();
}

/* -------------------------------
   INIT (BEFORE)
-------------------------------- */
function initEmbeddedMessaging() {
    try {
        console.log('🚀 BEFORE INIT');

        embeddedservice_bootstrap.settings.language = 'en_US';

        embeddedservice_bootstrap.settings.branding = {
            primaryColor: '#000000',
            primaryColorDark: '#000000',

            headerBackgroundColor: '#000000',
            headerTextColor: '#ffffff',

            launcherBackgroundColor: '#000000',
            launcherTextColor: '#ffffff',

            accentColor: '#ffffff',

            agentBubbleBackgroundColor: '#000000',
            agentBubbleTextColor: '#ffffff',
            userBubbleBackgroundColor: '#000000',
            userBubbleTextColor: '#ffffff'
        };

        log('🔹 settings (before init)', embeddedservice_bootstrap.settings);

        embeddedservice_bootstrap.init(
            '00DDh0000003ik2',
            'NA_Messaging_Chat',
            'https://enphase--uat.sandbox.my.site.com/ESWNAMessagingChat1755609473327',
            {
                scrt2URL: 'https://enphase--uat.sandbox.my.salesforce-scrt.com'
            }
        );

    } catch (err) {
        console.error('❌ init error', err);
    }
}

/* -------------------------------
   READY (AFTER)
-------------------------------- */
window.addEventListener('onEmbeddedMessagingReady', () => {
    console.log('✅ AFTER READY');

    /* LOG ALL AVAILABLE OBJECTS */
    log('🎨 brandingData (after)', embeddedservice_bootstrap.brandingData);
    log('⚙️ settings (after)', embeddedservice_bootstrap.settings);
    log('💬 conversationAPI', embeddedservice_bootstrap.conversationAPI);

    const em = document.querySelector('embedded-messaging');
    if (!em) {
        console.warn('❌ embedded-messaging not found');
        return;
    }

    console.log('🔍 embedded-messaging element:', em);

    if (!em.shadowRoot) {
        console.warn('❌ Shadow root NOT accessible');
        return;
    }

    console.log('🌑 shadowRoot accessible');

    /* APPLY MAX DARK PATCH */
    const style = document.createElement('style');
    style.textContent = `
        /* TRY TO FORCE CHAT BODY */
        .embeddedMessagingConversation {
            background: #111 !important;
        }

        /* Message bubbles */
        .embeddedMessagingMessage--agent,
        .embeddedMessagingMessage--user {
            background: #000 !important;
            color: #fff !important;
        }

        /* System messages */
        .embeddedMessagingSystemMessage {
            color: #fff !important;
        }

        /* Composer */
        textarea,
        input {
            background: #000 !important;
            color: #fff !important;
        }

        /* Icons */
        svg {
            fill: #fff !important;
        }
    `;
    em.shadowRoot.appendChild(style);

    console.log('✅ Dark patch injected');

    /* FINAL PROOF – INSPECT BACKGROUND */
    const convo = em.shadowRoot.querySelector('.embeddedMessagingConversation');
    if (convo) {
        console.log(
            '🧪 Chat background (computed):',
            getComputedStyle(convo).backgroundColor
        );
    } else {
        console.warn('❌ Conversation container not found');
    }
});
</script>

<script
    src="https://enphase--uat.sandbox.my.site.com/ESWNAMessagingChat1755609473327/assets/js/bootstrap.min.js"
    onload="initEmbeddedMessaging()">
</script>

</body>
</html>
