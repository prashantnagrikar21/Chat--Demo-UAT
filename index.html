<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Embedded Messaging – Branding Debug</title>

    <style>
        embedded-messaging {
            --branding-primary: #005290;
            --branding-primary-dark: #003a6f;
        }
    </style>
</head>

<body>

<h3>Embedded Messaging – Console Debug</h3>

<script>
/* --------------------------------------------------------
   GLOBAL DEBUG LOGGER
--------------------------------------------------------- */
function log(label, obj) {
    try {
        console.group(label);
        console.log(JSON.parse(JSON.stringify(obj)));
        console.groupEnd();
    } catch (e) {
        console.group(label);
        console.log(obj);
        console.groupEnd();
    }
}

/* --------------------------------------------------------
   INIT
--------------------------------------------------------- */
function initEmbeddedMessaging() {
    try {
        console.log('🚀 Initializing Embedded Messaging...');

        embeddedservice_bootstrap.settings.language = 'en_US';

        /* LOG SETTINGS BEFORE INIT */
        log('🔹 settings (before init)', embeddedservice_bootstrap.settings);

        embeddedservice_bootstrap.init(
            '00DDh0000003ik2',
            'NA_Messaging_Chat',
            'https://enphase--uat.sandbox.my.site.com/ESWNAMessagingChat1755609473327',
            {
                scrt2URL: 'https://enphase--uat.sandbox.my.salesforce-scrt.com'
            }
        );
    } catch (err) {
        console.error('❌ init error', err);
    }
}

/* --------------------------------------------------------
   READY EVENT – THIS IS WHERE EVERYTHING IS AVAILABLE
--------------------------------------------------------- */
window.addEventListener('onEmbeddedMessagingReady', () => {

    console.log('✅ Embedded Messaging Ready');

    /* CORE OBJECTS */
    log('🔹 embeddedservice_bootstrap', embeddedservice_bootstrap);

    log('🔹 settings (after init)', embeddedservice_bootstrap.settings);

    /* BRANDING */
    log('🎨 brandingData', embeddedservice_bootstrap.brandingData);

    /* PRECHAT */
    log('💬 prechatAPI', embeddedservice_bootstrap.prechatAPI);

    /* CONVERSATION */
    log('🧵 conversationAPI', embeddedservice_bootstrap.conversationAPI);

    /* EVENT API */
    log('📡 eventAPI', embeddedservice_bootstrap.eventAPI);

    /* INTERNAL STATE (may be undefined) */
    log('🧠 internalState', embeddedservice_bootstrap.internalState);

    /* SHADOW DOM INSPECTION */
    const em = document.querySelector('embedded-messaging');
    if (em && em.shadowRoot) {
        console.group('🌑 Shadow DOM');
        console.log(em.shadowRoot);
        console.groupEnd();
    } else {
        console.warn('⚠️ Shadow root not accessible yet');
    }
});

/* --------------------------------------------------------
   EXTRA SAFETY LOGGING
--------------------------------------------------------- */
window.addEventListener('message', (event) => {
    if (event?.data?.method || event?.data?.type) {
        console.log('📨 postMessage event:', event.data);
    }
});
</script>

<script
    src="https://enphase--uat.sandbox.my.site.com/ESWNAMessagingChat1755609473327/assets/js/bootstrap.min.js"
    onload="initEmbeddedMessaging()">
</script>

</body>
</html>
